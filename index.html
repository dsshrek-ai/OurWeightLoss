<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PWI — Weight Tracker</title>
<style>
/* ── reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue:     #1a73e8;
  --blue-lt:  #e8f0fe;
  --blue-dk:  #1557b0;
  --red:      #d93025;
  --red-lt:   #fce8e6;
  --green:    #188038;
  --green-lt: #e6f4ea;
  --yellow:   #f9ab00;
  --yellow-lt:#fef7e0;
  --gray-0:   #ffffff;
  --gray-1:   #f8f9fa;
  --gray-2:   #f1f3f4;
  --gray-3:   #e8eaed;
  --gray-5:   #9aa0a6;
  --gray-7:   #5f6368;
  --gray-9:   #202124;
  --radius:   8px;
  --shadow:   0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
  --shadow-md:0 4px 12px rgba(0,0,0,.15);
}
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px; color: var(--gray-9); background: var(--gray-1); line-height: 1.5; }

/* ── layout ── */
#app { display: flex; flex-direction: column; min-height: 100%; max-width: 640px;
  margin: 0 auto; background: var(--gray-0); }
header { position: sticky; top: 0; z-index: 10; background: var(--gray-0);
  border-bottom: 1px solid var(--gray-3); padding: 14px 16px; }
header .header-top { display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; }
header h1 { font-size: 20px; font-weight: 600; }
.logout-link { font-size: 13px; color: var(--gray-7); background: none; border: none;
  cursor: pointer; text-decoration: underline; }
main { flex: 1; padding: 16px 16px 40px; }

/* ── login screen ── */
.login-screen { min-height: 100%; display: flex; align-items: center; justify-content: center;
  padding: 24px; }
.login-card { width: 100%; max-width: 360px; background: var(--gray-0); border: 1px solid var(--gray-3);
  border-radius: 12px; padding: 24px; box-shadow: var(--shadow); }
.login-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 18px; text-align: center; }

/* ── form ── */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: var(--gray-7);
  margin-bottom: 5px; }
.field select, .field input { width: 100%; font-size: 15px; padding: 9px 10px;
  border: 1px solid var(--gray-3); border-radius: var(--radius);
  background: var(--gray-0); color: var(--gray-9); }
.person-name { padding: 9px 10px; border: 1px solid var(--gray-3); border-radius: var(--radius);
  background: var(--gray-2); color: var(--gray-9); font-size: 15px; font-weight: 500; }
.form-row { display: flex; gap: 10px; }
.form-row .field { flex: 1; }
.checkbox-field { display: flex; align-items: center; }
.checkbox-field label { display: flex; align-items: center; gap: 6px; font-size: 15px;
  font-weight: 400; color: var(--gray-9); margin-bottom: 0; cursor: pointer; }
.checkbox-field input[type="checkbox"] { width: 18px; height: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 11px 16px; border-radius: var(--radius); border: none;
  background: var(--blue); color: #fff; font-size: 15px; font-weight: 500; cursor: pointer;
  transition: background .15s; }
.btn:hover { background: var(--blue-dk); }
.btn:disabled { background: var(--gray-3); color: var(--gray-5); cursor: default; }

/* ── status / error ── */
.status-msg { text-align: center; padding: 32px; color: var(--gray-5); font-size: 14px; }
.error-msg { background: var(--red-lt); color: var(--red); border-radius: var(--radius);
  padding: 10px 14px; font-size: 14px; margin: 12px 0; }
.saved-msg { background: var(--green-lt); color: var(--green); border-radius: var(--radius);
  padding: 8px 14px; font-size: 13px; margin: 10px 0; text-align: center; }

/* ── banner ── */
.banner { display: flex; align-items: center; gap: 14px; background: var(--gray-1);
  border: 1px solid var(--gray-3); border-radius: 12px; padding: 16px; margin: 16px 0; }
.banner .indicator { font-size: 36px; width: 44px; text-align: center; flex-shrink: 0; }
.banner .indicator .dot { display: inline-block; width: 28px; height: 28px; border-radius: 50%; }
.banner .info .name { font-size: 13px; color: var(--gray-7); }
.banner .info .status { font-size: 20px; font-weight: 600; }
.banner .info .weight { font-size: 13px; color: var(--gray-7); margin-top: 2px; }
.banner .info .vitals { font-size: 12px; color: var(--gray-7); margin-top: 2px; }

/* ── range toggle ── */
.range-toggle { display: flex; gap: 8px; margin: 16px 0; }
.range-btn { flex: 1; padding: 8px 0; border: 1px solid var(--gray-3); border-radius: var(--radius);
  background: var(--gray-0); color: var(--gray-7); font-size: 13px; font-weight: 500; cursor: pointer; }
.range-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

/* ── chart ── */
.chart-card { background: var(--gray-0); border: 1px solid var(--gray-3); border-radius: 12px;
  padding: 16px; margin-bottom: 16px; }
.chart-card h2 { font-size: 14px; font-weight: 600; color: var(--gray-7); margin-bottom: 10px; }
.chart-wrap { position: relative; height: 220px; }
.chart-wrap canvas { width: 100%; height: 100%; }
.bp-legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px;
  font-size: 11px; color: var(--gray-7); }

/* ── table ── */
.history h2 { font-size: 14px; font-weight: 600; color: var(--gray-7); margin: 0 0 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--gray-3); }
th { color: var(--gray-7); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; }
.sign { font-weight: 700; }
.sign-plus { color: var(--red); }
.sign-minus { color: var(--green); }
.sign-equal { color: var(--gray-5); }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
.dot-green { background: var(--green); }
.dot-yellow { background: var(--yellow); }
.dot-red { background: var(--red); }
.dot-gray { background: var(--gray-5); }
.emoji-cell { font-size: 15px; }
</style>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>PWI — Weight Tracker</h1>
    <div class="field">
      <label for="loginName">Name</label>
      <select id="loginName"></select>
    </div>
    <div class="field">
      <label for="loginPw">Password</label>
      <input type="password" id="loginPw">
    </div>
    <button class="btn" id="loginBtn">Log in</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="header-top">
      <h1>PWI — Weight Tracker</h1>
      <button class="logout-link" id="logoutBtn">Log out</button>
    </div>
    <div class="field">
      <label>Person</label>
      <div class="person-name" id="personName"></div>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field">
        <label for="weightInput">Weight</label>
        <input type="number" id="weightInput" step="0.1" placeholder="lbs">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="bpInput">Blood Pressure</label>
        <input type="text" id="bpInput" placeholder="120/80">
      </div>
      <div class="field">
        <label for="sugarInput">Blood Sugar</label>
        <input type="number" id="sugarInput" step="1" placeholder="mg/dL">
      </div>
    </div>
    <div class="form-row">
      <div class="field checkbox-field">
        <label><input type="checkbox" id="gymInput"> Gym</label>
      </div>
      <div class="field checkbox-field">
        <label><input type="checkbox" id="walkInput"> Walk</label>
      </div>
      <div class="field">
        <label for="walkDistanceInput">Walk Distance</label>
        <input type="number" id="walkDistanceInput" step="0.1" placeholder="mi">
      </div>
    </div>
    <button class="btn" id="saveBtn">Check in</button>
    <div id="saveMsg"></div>
  </header>

  <main id="main">
    <div class="status-msg">Loading…</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzepqhhk61O2a6BwALRmIoA_lE5hZKpN_DoX3x0L2VdQpFPkL5dJii1TmpNyJPUPRCo/exec';
const AUTH_KEY = 'pwi_auth';

let allItems = [];
let selectedName = '';
let focusDate = null; // when set, banner shows this date's entry instead of the latest
let chartInstance = null;
let sugarChartInstance = null;
let bpChartInstance = null;
let gymChartInstance = null;
let walkChartInstance = null;
let walkDistanceChartInstance = null;
let auth = null; // { user, pw }
let chartRangeDays = 30;

const loginScreen  = document.getElementById('loginScreen');
const loginName    = document.getElementById('loginName');
const loginPw      = document.getElementById('loginPw');
const loginBtn     = document.getElementById('loginBtn');
const loginMsg     = document.getElementById('loginMsg');
const logoutBtn    = document.getElementById('logoutBtn');

const appEl        = document.getElementById('app');
const personName   = document.getElementById('personName');
const dateInput    = document.getElementById('dateInput');
const weightInput  = document.getElementById('weightInput');
const bpInput      = document.getElementById('bpInput');
const sugarInput   = document.getElementById('sugarInput');
const gymInput     = document.getElementById('gymInput');
const walkInput    = document.getElementById('walkInput');
const walkDistanceInput = document.getElementById('walkDistanceInput');
const saveBtn      = document.getElementById('saveBtn');
const saveMsg      = document.getElementById('saveMsg');
const main         = document.getElementById('main');

function todayISO() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function round1(n) { return Math.round(n * 10) / 10; }

function fmtDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return `${m}/${d}/${String(y).slice(2)}`;
}

function parseBp(bpStr) {
  const m = bpStr && String(bpStr).match(/(\d+)\s*\/\s*(\d+)/);
  return m ? { sys: Number(m[1]), dia: Number(m[2]) } : { sys: null, dia: null };
}

// WHO/ISH blood pressure categories. Systolic and diastolic each have their
// own mmHg cutoffs, but share the same severity ladder, so a reading's shape
// reflects how far *either* value has climbed regardless of which line it's on.
const BP_GRADES = [
  { label: 'Optimal/Normal', shape: 'circle',   radius: 3 },
  { label: 'High-normal',    shape: 'rect',     radius: 4 },
  { label: 'Grade 1',        shape: 'triangle', radius: 5 },
  { label: 'Grade 2',        shape: 'rectRot',  radius: 6 },
  { label: 'Grade 3',        shape: 'star',     radius: 7 },
];
const SYS_CUTOFFS = [130, 140, 160, 180];
const DIA_CUTOFFS = [85, 90, 100, 110];

function bpGrade(value, cutoffs) {
  let idx = 0;
  for (let i = 0; i < cutoffs.length; i++) if (value >= cutoffs[i]) idx = i + 1;
  return BP_GRADES[idx];
}

function rangeLabel(days) { return days === 365 ? 'last year' : `last ${days} days`; }

// ISO-8601 week number + week-year (week-year differs from calendar year for
// dates in early Jan / late Dec that belong to the adjacent year's week 1/52).
function isoWeekInfo(dateISO) {
  const [y, m, d] = dateISO.split('-').map(Number);
  const date = new Date(Date.UTC(y, m - 1, d));
  const dayNum = (date.getUTCDay() + 6) % 7; // Mon=0..Sun=6
  date.setUTCDate(date.getUTCDate() - dayNum + 3); // nearest Thursday
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  const week = 1 + Math.round((date - firstThursday) / (7 * 86400000));
  return { week, year: date.getUTCFullYear() };
}

// Group entries into one bucket per ISO week, in chronological order, even
// for weeks with zero gym/walk activity so trend gaps are visible.
function weeklyAggregate(entries) {
  const map = new Map();
  entries.forEach(e => {
    const { week, year } = isoWeekInfo(e.date);
    const key = `${year}-W${String(week).padStart(2, '0')}`;
    if (!map.has(key)) map.set(key, { week, year, gym: 0, walk: 0, miles: 0 });
    const rec = map.get(key);
    if (e.gym) rec.gym++;
    if (e.walk) rec.walk++;
    if (e.walkDistance) rec.miles = round1(rec.miles + e.walkDistance);
  });
  const weeks = [...map.values()].sort((a, b) => a.year - b.year || a.week - b.week);
  const multiYear = new Set(weeks.map(w => w.year)).size > 1;
  weeks.forEach(w => { w.label = multiYear ? `Wk${w.week} '${String(w.year).slice(2)}` : `Wk${w.week}`; });
  return weeks;
}

// Entries within the `days` window ending on the most recent entry's date.
function windowLastNDays(series, days) {
  const lastDate = series[series.length - 1].date;
  const cutoff = new Date(lastDate);
  cutoff.setDate(cutoff.getDate() - (days - 1));
  const cutoffISO = `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, '0')}-${String(cutoff.getDate()).padStart(2, '0')}`;
  return series.filter(e => e.date >= cutoffISO && e.date <= lastDate);
}

async function fetchJSON(params) {
  const url = SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// ── auth storage ────────────────────────────────────────────────────────────
function loadAuth() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch { return null; }
}
function saveAuth(a) { localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
function clearAuth() { localStorage.removeItem(AUTH_KEY); }

function showLogin(message) {
  clearAuth();
  auth = null;
  appEl.style.display = 'none';
  loginScreen.style.display = 'flex';
  loginMsg.innerHTML = message ? `<div class="error-msg">${message}</div>` : '';
}

function showApp() {
  loginScreen.style.display = 'none';
  appEl.style.display = '';
}

// ── derived calculations ────────────────────────────────────────────────────
function computeSeries(entries) {
  const sorted = entries.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  let runningMin = Infinity;
  let prevWeight = null;
  return sorted.map((e, idx) => {
    const w = round1(e.weight);

    let status, indicator, color;
    if (idx === 0) {
      // First-ever entry for this person: nothing to compare against yet.
      status = 'Start'; indicator = 'dot'; color = 'gray';
    } else {
      const diff = round1(w - runningMin);
      if (diff < 0) {
        status = 'NewMin'; indicator = 'emoji';
      } else if (diff === 0) {
        status = '=Min'; indicator = 'dot'; color = 'green';
      } else if (diff < 3) {
        status = '>Min'; indicator = 'dot'; color = 'green';
      } else if (diff < 5) {
        status = '>Min'; indicator = 'dot'; color = 'yellow';
      } else {
        status = '>Max'; indicator = 'dot'; color = 'red';
      }
    }

    let sign = '', deltaAbs = null;
    if (prevWeight !== null) {
      const d = round1(w - prevWeight);
      sign = d > 0 ? '+' : (d < 0 ? '-' : '=');
      deltaAbs = Math.abs(d);
    }

    runningMin = Math.min(runningMin, w);
    prevWeight = w;

    return { date: e.date, weight: w, bp: e.bp, sugar: e.sugar, gym: e.gym, walk: e.walk,
             walkDistance: e.walkDistance, status, indicator, color, sign, deltaAbs };
  });
}

function activityParts(e) {
  const parts = [];
  if (e.gym) parts.push('🏋️ Gym');
  if (e.walk) parts.push(e.walkDistance ? `🚶 ${e.walkDistance} mi` : '🚶 Walk');
  return parts;
}

function indicatorHTML(entry, size) {
  if (entry.indicator === 'emoji') {
    return `<span class="emoji-cell" style="font-size:${size}px">🎉</span>`;
  }
  return `<span class="dot dot-${entry.color}" style="width:${size * .55}px;height:${size * .55}px"></span>`;
}

// ── rendering ────────────────────────────────────────────────────────────────
function render() {
  if (!selectedName) {
    main.innerHTML = '<div class="status-msg">No people found in the sheet yet.</div>';
    return;
  }

  const series = computeSeries(allItems.filter(i => i.name === selectedName));
  if (series.length === 0) {
    main.innerHTML = '<div class="status-msg">No entries yet for ' + selectedName + '.</div>';
    return;
  }

  const focus = (focusDate && series.find(e => e.date === focusDate)) || series[series.length - 1];
  const vitals = [focus.bp ? `BP ${focus.bp}` : '', focus.sugar ? `Sugar ${focus.sugar}` : '', ...activityParts(focus)]
    .filter(Boolean).join(' · ');

  const windowed = windowLastNDays(series, chartRangeDays);
  const sugarPoints = windowed.filter(e => e.sugar).map(e => ({ date: e.date, sugar: Number(e.sugar) }));
  const bpPoints = windowed.map(e => ({ date: e.date, ...parseBp(e.bp) })).filter(p => p.sys !== null && p.dia !== null);
  const weekly = weeklyAggregate(windowed);
  const anyGym = windowed.some(e => e.gym);
  const anyWalk = windowed.some(e => e.walk || e.walkDistance);
  const rangeBtn = (days, text) =>
    `<button type="button" class="range-btn${chartRangeDays === days ? ' active' : ''}" data-range="${days}">${text}</button>`;

  main.innerHTML = `
    <div class="banner">
      <div class="indicator">${indicatorHTML(focus, 36)}</div>
      <div class="info">
        <div class="name">${selectedName} — ${fmtDate(focus.date)}</div>
        <div class="status">${focus.status}</div>
        <div class="weight">${focus.weight.toFixed(1)} lbs</div>
        ${vitals ? `<div class="vitals">${vitals}</div>` : ''}
      </div>
    </div>
    <div class="range-toggle">
      ${rangeBtn(30, '30D')}
      ${rangeBtn(90, '90D')}
      ${rangeBtn(365, '1Y')}
    </div>
    <div class="chart-card">
      <h2>Weight — ${rangeLabel(chartRangeDays)}</h2>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </div>
    ${sugarPoints.length ? `
    <div class="chart-card">
      <h2>Blood Sugar — ${rangeLabel(chartRangeDays)}</h2>
      <div class="chart-wrap"><canvas id="sugarChart"></canvas></div>
    </div>` : ''}
    ${bpPoints.length ? `
    <div class="chart-card">
      <h2>Blood Pressure — ${rangeLabel(chartRangeDays)}</h2>
      <div class="chart-wrap"><canvas id="bpChart"></canvas></div>
      <div class="bp-legend">
        <span>&#9679; Optimal/Normal</span>
        <span>&#9632; High-normal</span>
        <span>&#9650; Grade 1</span>
        <span>&#9670; Grade 2</span>
        <span>&#9733; Grade 3</span>
      </div>
    </div>` : ''}
    ${anyGym ? `
    <div class="chart-card">
      <h2>Gym Visits per Week — ${rangeLabel(chartRangeDays)}</h2>
      <div class="chart-wrap"><canvas id="gymChart"></canvas></div>
    </div>` : ''}
    ${anyWalk ? `
    <div class="chart-card">
      <h2>Walks per Week — ${rangeLabel(chartRangeDays)}</h2>
      <div class="chart-wrap"><canvas id="walkChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h2>Miles Walked per Week — ${rangeLabel(chartRangeDays)}</h2>
      <div class="chart-wrap"><canvas id="walkDistanceChart"></canvas></div>
    </div>` : ''}
    <div class="history">
      <h2>History</h2>
      <table>
        <thead>
          <tr><th>Date</th><th class="num">Weight</th><th class="num">Trend</th><th class="num">Δ</th><th>BP</th><th class="num">Sugar</th><th>Activity</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
          ${series.slice().reverse().map(rowHTML).join('')}
        </tbody>
      </table>
    </div>
  `;

  renderChart(windowed);

  if (sugarPoints.length) renderSugarChart(sugarPoints);
  else if (sugarChartInstance) { sugarChartInstance.destroy(); sugarChartInstance = null; }

  if (bpPoints.length) renderBpChart(bpPoints);
  else if (bpChartInstance) { bpChartInstance.destroy(); bpChartInstance = null; }

  if (anyGym) renderGymChart(weekly);
  else if (gymChartInstance) { gymChartInstance.destroy(); gymChartInstance = null; }

  if (anyWalk) { renderWalkChart(weekly); renderWalkDistanceChart(weekly); }
  else {
    if (walkChartInstance) { walkChartInstance.destroy(); walkChartInstance = null; }
    if (walkDistanceChartInstance) { walkDistanceChartInstance.destroy(); walkDistanceChartInstance = null; }
  }
}

function rowHTML(e) {
  const signClass = e.sign === '+' ? 'sign-plus' : e.sign === '-' ? 'sign-minus' : 'sign-equal';
  return `
    <tr>
      <td>${fmtDate(e.date)}</td>
      <td class="num">${e.weight.toFixed(1)}</td>
      <td class="num"><span class="sign ${signClass}">${e.sign || '—'}</span></td>
      <td class="num">${e.deltaAbs === null ? '—' : e.deltaAbs.toFixed(1)}</td>
      <td>${e.bp || '—'}</td>
      <td class="num">${e.sugar || '—'}</td>
      <td>${activityParts(e).join(' ') || '—'}</td>
      <td>${e.status}</td>
      <td>${indicatorHTML(e, 16)}</td>
    </tr>
  `;
}

function renderChart(windowed) {
  if (chartInstance) chartInstance.destroy();
  const ctx = document.getElementById('chart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: windowed.map(e => fmtDate(e.date)),
      datasets: [{
        data: windowed.map(e => e.weight),
        borderColor: '#1a73e8',
        backgroundColor: 'rgba(26,115,232,.08)',
        tension: 0.4,
        fill: true,
        pointRadius: 3,
        pointBackgroundColor: '#1a73e8'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { ticks: { precision: 1 } } }
    }
  });
}

function renderSugarChart(points) {
  if (sugarChartInstance) sugarChartInstance.destroy();
  const ctx = document.getElementById('sugarChart').getContext('2d');
  sugarChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: points.map(p => fmtDate(p.date)),
      datasets: [{
        data: points.map(p => p.sugar),
        borderColor: '#f9ab00',
        backgroundColor: 'rgba(249,171,0,.08)',
        tension: 0.4,
        fill: true,
        pointRadius: 3,
        pointBackgroundColor: '#f9ab00'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { ticks: { precision: 0 } } }
    }
  });
}

function renderBpChart(points) {
  if (bpChartInstance) bpChartInstance.destroy();

  const sysGrades = points.map(p => bpGrade(p.sys, SYS_CUTOFFS));
  const diaGrades = points.map(p => bpGrade(p.dia, DIA_CUTOFFS));

  const ctx = document.getElementById('bpChart').getContext('2d');
  bpChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: points.map(p => fmtDate(p.date)),
      datasets: [
        {
          label: 'Systolic',
          data: points.map(p => p.sys),
          borderColor: '#d93025',
          backgroundColor: 'rgba(217,48,37,.08)',
          tension: 0.4,
          pointStyle: sysGrades.map(g => g.shape),
          pointRadius: sysGrades.map(g => g.radius),
          pointBackgroundColor: '#d93025',
          bpGrades: sysGrades
        },
        {
          label: 'Diastolic',
          data: points.map(p => p.dia),
          borderColor: '#1a73e8',
          backgroundColor: 'rgba(26,115,232,.08)',
          tension: 0.4,
          pointStyle: diaGrades.map(g => g.shape),
          pointRadius: diaGrades.map(g => g.radius),
          pointBackgroundColor: '#1a73e8',
          bpGrades: diaGrades
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label(ctx) {
              const grade = ctx.dataset.bpGrades[ctx.dataIndex].label;
              return `${ctx.dataset.label}: ${ctx.parsed.y} (${grade})`;
            }
          }
        }
      },
      scales: { y: { ticks: { precision: 0 } } }
    }
  });
}

// Show the existing entry for this date (if any) so a check-in overwrites on
// purpose rather than by surprise, and so entering just one new field (e.g.
// blood sugar) doesn't blank out that day's weight/BP.
function prefillForDate(date) {
  if (!selectedName) return;
  const existing = allItems.find(i => i.name === selectedName && i.date === date);
  weightInput.value = existing ? existing.weight : '';
  bpInput.value = existing ? (existing.bp || '') : '';
  sugarInput.value = existing ? (existing.sugar || '') : '';
  gymInput.checked = existing ? !!existing.gym : false;
  walkInput.checked = existing ? !!existing.walk : false;
  walkDistanceInput.value = existing && existing.walkDistance !== null ? existing.walkDistance : '';
}

// ── data flow ────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const data = await fetchJSON({ action: 'list', user: auth.user, pw: auth.pw });
    allItems = data.items;
    selectedName = auth.user;
    personName.textContent = auth.user;
    render();
    prefillForDate(dateInput.value);
  } catch (err) {
    if (/incorrect|password/i.test(err.message)) {
      showLogin('Your saved login stopped working. Please log in again.');
    } else {
      main.innerHTML = `<div class="error-msg">Couldn't load data: ${err.message}</div>`;
    }
  }
}

async function saveEntry() {
  const name = auth.user;
  const date = dateInput.value;
  const weight = weightInput.value;
  const bp = bpInput.value.trim();
  const sugar = sugarInput.value;
  const gym = gymInput.checked;
  const walk = walkInput.checked;
  const walkDistance = walkInput.checked ? walkDistanceInput.value : '';

  if (!name || !date || !weight) {
    saveMsg.innerHTML = '<div class="error-msg">Pick a date and weight first.</div>';
    return;
  }

  saveBtn.disabled = true;
  saveMsg.innerHTML = '';
  try {
    const data = await fetchJSON({ action: 'save', user: auth.user, pw: auth.pw, name, date, weight, bp, sugar, gym, walk, walkDistance });
    allItems = data.items;
    selectedName = name;
    focusDate = date;
    render();
    prefillForDate(date);
    saveMsg.innerHTML = '<div class="saved-msg">Saved.</div>';
    setTimeout(() => { saveMsg.innerHTML = ''; }, 2500);
  } catch (err) {
    saveMsg.innerHTML = `<div class="error-msg">Couldn't save: ${err.message}</div>`;
  } finally {
    saveBtn.disabled = false;
  }
}

saveBtn.addEventListener('click', saveEntry);
logoutBtn.addEventListener('click', () => showLogin());
dateInput.addEventListener('change', () => prefillForDate(dateInput.value));
main.addEventListener('click', (ev) => {
  const btn = ev.target.closest('.range-btn');
  if (!btn) return;
  chartRangeDays = Number(btn.dataset.range);
  render();
});

// ── login flow ──────────────────────────────────────────────────────────────
async function populateLoginNames() {
  try {
    const data = await fetchJSON({ action: 'users' });
    loginName.innerHTML = data.names.map(n => `<option value="${n}">${n}</option>`).join('');
  } catch (err) {
    loginMsg.innerHTML = `<div class="error-msg">Couldn't load users: ${err.message}</div>`;
  }
}

async function attemptLogin() {
  const user = loginName.value;
  const pw = loginPw.value;
  if (!user || !pw) {
    loginMsg.innerHTML = '<div class="error-msg">Pick your name and enter your password.</div>';
    return;
  }
  loginBtn.disabled = true;
  loginMsg.innerHTML = '';
  try {
    const result = await fetchJSON({ action: 'login', user, pw });
    if (!result.ok) throw new Error(result.error || 'Incorrect name or password');
    auth = { user, pw };
    saveAuth(auth);
    loginPw.value = '';
    showApp();
    main.innerHTML = '<div class="status-msg">Loading…</div>';
    loadData();
  } catch (err) {
    loginMsg.innerHTML = `<div class="error-msg">${err.message}</div>`;
  } finally {
    loginBtn.disabled = false;
  }
}

loginBtn.addEventListener('click', attemptLogin);
loginPw.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') attemptLogin(); });

dateInput.value = todayISO();

if (SCRIPT_URL.includes('YOUR_APPS_SCRIPT_URL')) {
  document.body.innerHTML = '<div class="error-msg" style="margin:24px">Set SCRIPT_URL in index.html to your deployed Apps Script URL (see SETUP.md).</div>';
} else {
  populateLoginNames();
  auth = loadAuth();
  if (auth) {
    showApp();
    loadData();
  }
}
</script>
